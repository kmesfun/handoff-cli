[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handoff-cli"
version = "0.1.0"
description = "A Git-aware PR readiness and developer handoff CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["git", "cli", "pull-request", "developer-tools", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
handoff = "handoff.main:main"

[project.urls]
Homepage = "https://github.com/kennedym/handoff-cli"
Repository = "https://github.com/kennedym/handoff-cli"
Issues = "https://github.com/kennedym/handoff-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["handoff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["handoff"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_classes = "Check Scenario"

[tool.coverage.run]
source = ["handoff"]
omit = ["tests/*"]
